<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta http-equiv="refresh" content="0;url={{ target }}">
<title>Return to your agent – Shijhon</title>
{# (A page of the agent sign-in's own address: the stylesheet is served beside it.) #}
<link rel="stylesheet" href="static/shijhon.css">
</head>
<body>
<main id="main" class="signin agent-signin">
  <p class="wordmark">Shijhon</p>
  <div class="signin-panel">
    <h1>Return to your agent</h1>
    <p>This page takes you back on its own. If nothing happens, use the button.</p>
    <p class="signin-actions"><a class="btn btn-primary" id="agent-return" href="{{ target }}" rel="noreferrer">Continue</a></p>
  </div>
</main>
{% from "_macros.html" import legal %}
<footer class="signin-footer">
  {{ legal(version, copyright, license, source_url) }}
</footer>
</body>
</html>
