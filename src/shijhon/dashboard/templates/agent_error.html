<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Agent connection – Shijhon</title>
{# (A page of the agent sign-in's own address: the stylesheet is served beside it.) #}
<link rel="stylesheet" href="static/shijhon.css">
</head>
<body>
<main id="main" class="signin agent-signin">
  <p class="wordmark">Shijhon</p>
  <div class="signin-panel">
    <h1>Agent connection failed</h1>
    <div class="notice notice-error" role="alert">
      <p>{{ error }}</p>
    </div>
    <p>Return to your agent and start the connection again.</p>
  </div>
</main>
</body>
</html>
